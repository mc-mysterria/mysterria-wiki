# Starlight wiki - static output, served inside the app container.
#
# Host nginx terminates TLS for wiki.mysterria.net and proxies here, so this
# server block is plain HTTP on 80 and does no redirecting of its own.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Astro fingerprints everything under _astro/, so it is safe to pin hard.
    # `expires` is deliberately not used alongside this: it emits its own
    # Cache-Control and the two then both appear on the response.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Starlight emits a directory per page with an index.html inside, so a bare
    # /guides/foo must resolve to /guides/foo/index.html.
    #
    # `$uri/` is deliberately absent: a section directory such as /guides/ holds
    # only child pages and no index.html of its own, and `$uri/` would match the
    # directory and then fail the index lookup as 403 Forbidden. Falling straight
    # to =404 lets error_page serve Starlight's own 404 page - with a 404 status,
    # which a `/404.html` fallback inside try_files would have turned into a 200.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
