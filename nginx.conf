# Starlight wiki - static output, served inside the app container.
#
# Host nginx terminates TLS for wiki.mysterria.net and proxies here, so this
# server block is plain HTTP on 80 and does no redirecting of its own.

server {
    listen 80;
    server_name _;
    # TLS ends at the host's nginx, so this one only sees http. Relative Location headers keep
    # its redirects on the scheme and host the reader used (https://wiki.mysterria.net).
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Astro fingerprints everything under _astro/, so it is safe to pin hard.
    # `expires` is deliberately not used alongside this: it emits its own
    # Cache-Control and the two then both appear on the response.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Starlight emits a directory per page with an index.html inside, so a bare
    # /guides/foo must resolve to /guides/foo/index.html.
    #
    # `$uri/` is deliberately absent: a section directory such as /guides/ holds
    # only child pages and no index.html of its own, and `$uri/` would match the
    # directory and then fail the index lookup as 403 Forbidden. Falling straight
    # to =404 lets error_page serve Starlight's own 404 page - with a 404 status,
    # which a `/404.html` fallback inside try_files would have turned into a 200.
    # English moved from /en/ to the root. Google still shows /en/ URLs, so send them on with a
    # real 301 (astro.config.mjs also writes meta-refresh pages for hosts without this file).
    # Old per-Pathway pages now live on the main site (before the /en/ rule, so one hop).
    rewrite ^/(en/)?pathways/([a-z]+)/?$ https://www.mysterria.net/en/pathways/$2 permanent;
    # Old pages that no longer exist.
    rewrite ^/(en/)?support/about/?$ / permanent;
    rewrite ^/promoters/application/?$ / permanent;
    rewrite ^/(en/)?guides/(archive|silkroad)/?$ / permanent;
    rewrite ^/uk/guides/(archive|silkroad)/?$ /uk/ permanent;
    rewrite ^/en/?$ / permanent;
    rewrite ^/en/(.*)$ /$1 permanent;

    # Pages merged or removed in the Epoch II rewrite (astro.config.mjs has the same list).
    rewrite ^/guides/shards/?$ /guides/economy/#energy-shards permanent;
    rewrite ^/guides/daily/?$ /guides/emporium/#daily-rewards permanent;
    rewrite ^/guides/tperks/?$ /guides/towns/#town-perks permanent;
    rewrite ^/(uk|ro|de|es|fr|zh-cn|zh-tw)/guides/shards/?$ /$1/guides/economy/#energy-shards permanent;
    rewrite ^/(uk|ro|de|es|fr|zh-cn|zh-tw)/guides/daily/?$ /$1/guides/emporium/#daily-rewards permanent;
    rewrite ^/(uk|ro|de|es|fr|zh-cn|zh-tw)/guides/tperks/?$ /$1/guides/towns/#town-perks permanent;
    rewrite ^/misc/creator-program/?$ / permanent;
    rewrite ^/(uk|ro|de|es|fr|zh-cn|zh-tw)/misc/creator-program/?$ /$1/ permanent;

    # The search data (the quick search's JSON and Pagefind's index) is for the page's own script,
    # not for search results.
    location ^~ /search/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location ^~ /pagefind/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
        # www.mysterria.net may load a wiki page in the background when a reader points at a wiki
        # link (its speculation rules), so the switch is instant. Same site, so this opt-in is all it takes.
        add_header Supports-Loading-Mode "credentialed-prerender" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
